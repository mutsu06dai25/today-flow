name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # アップロードした today-flow.zip を展開して、その中でビルドする
      - name: Unzip project
        run: unzip -q today-flow.zip -d work

      - name: Build APK
        working-directory: work/today-flow
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp work/today-flow/app/build/outputs/apk/release/app-release.apk today-flow.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 今日の流れ ${{ github.run_number }}
          files: today-flow.apk
          make_latest: true
